<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA Security+ SY0-701 - PBQ Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="exam-header">
        <h1>CompTIA Security+ (SY0-701) - PBQ Simulator</h1>
        <div id="pbq-selector" class="pbq-selector"></div>
    </header>

    <main class="pbq-container">
        <section class="instructions">
            <h2 id="pbq-title">Cargando escenario...</h2>
            <p id="pbq-instructions"></p>
        </section>

        <div class="interactive-area">
            <div class="source-panel">
                <h3>Componentes / Controles</h3>
                <div class="draggable-items" id="draggable-container"></div>
            </div>

            <div class="target-panel" id="target-panel"></div>
        </div>

        <div class="action-panel">
            <button id="btn-submit" class="btn">Enviar Respuestas</button>
            <button id="btn-reset" class="btn btn-secondary">Reiniciar PBQ</button>
        </div>

        <div id="feedback-panel" class="feedback-panel hidden"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
